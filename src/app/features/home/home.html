<app-header>
  <div class="home__nav-user">
    <button type="button" class="home__nav-user-toggle" (click)="toggleUserMenu()">
      <span>{{ profile()?.name }}</span>
      <app-icon name="chevron-down" />
    </button>

    @if (userMenuOpen()) {
      <div class="home__nav-user-menu">
        <button type="button" (click)="logout()">Logout</button>
      </div>
    }
  </div>

  @if (isTeamSearchOpen()) {
    <div class="home__nav-search-wrap">
      <app-search-input placeholder="Buscar en tu equipo..." (queryChange)="handleTeamSearch($event)" />
    </div>
  } @else {
    <button type="button" class="home__nav-search-toggle" aria-label="Buscar en tu equipo" (click)="openTeamSearch()">
      <app-icon name="search" />
    </button>
  }
</app-header>

@if (userMenuOpen()) {
  <button type="button" class="home__backdrop" aria-label="Cerrar menú" (click)="closeUserMenu()"></button>
}

<main class="home">
  <div class="home__greeting">
    <h1>¡Hola {{ profile()?.name }}!</h1>
    <app-outline-button icon="edit" (click)="editProfile()">Editar perfil</app-outline-button>
  </div>

  <div class="home__columns">
    <app-trainer-card class="home__trainer-card" />

    <section class="home__team">
      <div class="home__team-heading">
        <app-section-heading heading="Mis Pokémon" />
        <app-outline-button icon="edit" (click)="editTeam()">Editar</app-outline-button>
      </div>

      <div class="home__team-list">
        @for (pokemon of filteredTeam(); track pokemon.id) {
          <app-pokemon-stat-card [pokemon]="pokemon" />
        } @empty {
          <p class="home__team-empty">Ningún Pokémon coincide con la búsqueda.</p>
        }
      </div>
    </section>
  </div>
</main>

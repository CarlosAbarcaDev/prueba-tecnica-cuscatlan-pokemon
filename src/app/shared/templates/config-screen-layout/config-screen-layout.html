<app-header />

<main class="config-screen">
  <div class="config-screen__heading">
    <span class="config-screen__back" aria-hidden="true">‹</span>
    <h1>{{ heading() }}</h1>
  </div>
  @if (subtitle()) {
    <p class="config-screen__subtitle">{{ subtitle() }}</p>
  }

  <div class="config-screen__layout">
    <ng-content select="[left]" />
    <ng-content select="[right]" />
  </div>
</main>
